version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      majors:
        update-types: ["major"]
  - package-ecosystem: "nuget"
    directories: ["/src/NetPaw.Core", "/src/NetPaw.Tray", "/src/NetPaw.Cli", "/tests/NetPaw.Core.Tests"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:40"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      majors:
        update-types: ["major"]
