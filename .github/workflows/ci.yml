name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', 'deploy/gpo/**', 'deploy/intune/**' ]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  test-and-publish:
    # Linux runner on purpose: NetPaw.Core is OS-neutral and the WinForms app cross-compiles
    # via EnableWindowsTargeting. Only the netsh/GUI behaviour needs a real Windows box.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET install directory
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/NetPaw.Core.Tests --verbosity minimal
      - name: Validate packs (hashes, schema, signature)
        run: |
          dotnet build src/NetPaw.Cli -c Release
          for f in packs/*/index.json; do
            dotnet src/NetPaw.Cli/bin/Release/net10.0/netpaw-cli.dll pack verify "$f" "$(cat "$(dirname "$f")/public.txt")"
          done
      - name: Publish (framework-dependent, tiny)
        run: |
          dotnet publish src/NetPaw.Tray -c Release -r win-x64 --self-contained false -o out/netpaw-win-x64
          dotnet publish src/NetPaw.Cli  -c Release -r win-x64 --self-contained false -o out/netpaw-win-x64
      - name: Default build carries no telemetry strings
        # The opt-in telemetry variant is the only binary allowed to know the hub (hostname) or carry a token prefix; the default exe must scan clean.
        # ("telemetry" alone is fine: the CLI help mentions the -telemetry.msi variant.)
        run: |
          python3 - <<'EOF'
          import sys
          bad = [n for f in ("out/netpaw-win-x64/NetPaw.exe", "out/netpaw-win-x64/netpaw-cli.exe")
                 for n in (b"catboy", b"cattel_") if (lambda b: b.count(n) + b.count(n.decode().encode("utf-16-le")))(open(f, "rb").read())]
          print("telemetry strings in default build:", bad or "none")
          sys.exit(1 if bad else 0)
          EOF
      - name: Publish (self-contained, no runtime needed)
        run: |
          dotnet publish src/NetPaw.Tray -c Release -r win-x64 --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -o out/netpaw-win-x64-standalone
          dotnet publish src/NetPaw.Cli  -c Release -r win-x64 --self-contained true -o out/netpaw-win-x64-standalone
      - name: Zip
        # Not every self-hosted runner ships `zip` (runner2 does not); python's zipfile is the fallback.
        run: |
          cd out && rm -f */*.pdb
          mkzip() {
            if command -v zip >/dev/null; then zip -qr "$1" "$2";
            elif command -v python3 >/dev/null; then python3 -c "import shutil,sys; shutil.make_archive(sys.argv[1][:-4], 'zip', '.', sys.argv[2])" "$1" "$2";
            elif command -v 7z >/dev/null; then 7z a -bso0 "$1" "$2";
            else echo "no zip tool on this runner" >&2; exit 1; fi
          }
          mkzip netpaw-win-x64.zip netpaw-win-x64
          mkzip netpaw-win-x64-standalone.zip netpaw-win-x64-standalone
          ls -la *.zip
      - uses: actions/upload-artifact@v7
        continue-on-error: true   # artifact quota must not fail the job
        with:
          name: netpaw-win-x64
          path: out/*.zip
          retention-days: 14
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*.zip
          generate_release_notes: true

  msi:
    # The only job on a hosted Windows runner: WiX 5 needs Windows, and msiexec lets CI prove the
    # package installs and uninstalls cleanly. Free for a public repo.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish (framework-dependent)
        run: |
          dotnet publish src/NetPaw.Tray -c Release -r win-x64 --self-contained false -o out/bin
          dotnet publish src/NetPaw.Cli  -c Release -r win-x64 --self-contained false -o out/bin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build MSI (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build deploy/msi/Package.wxs -arch x64 -d Version=${{ steps.ver.outputs.version }} -d BinDir=out/bin -o out/NetPaw-${{ steps.ver.outputs.version }}.msi
      - name: Install / verify / uninstall
        shell: pwsh
        run: |
          $msi = Get-Item out/*.msi
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v out/install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content out/install.log | Select-Object -Last 40; throw "install exit $($p.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\NetPaw\NetPaw.exe")) { throw "NetPaw.exe missing after install" }
          if (-not (Test-Path "$env:ProgramData\NetPaw\profiles.d")) { throw "profiles.d missing after install" }
          & "$env:ProgramFiles\NetPaw\netpaw-cli.exe" where
          & "$env:ProgramFiles\NetPaw\netpaw-cli.exe" policy
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\NetPaw\NetPaw.exe") { throw "NetPaw.exe still present after uninstall" }
      - name: Telemetry variant (only when the project token secret exists — opt-in download)
        if: env.TOKEN != ''
        shell: pwsh
        env:
          TOKEN: ${{ secrets.NETPAW_TELEMETRY_TOKEN }}
        run: |
          dotnet publish src/NetPaw.Tray -c Release -r win-x64 --self-contained false -o out/bin-telemetry -p:Telemetry=true "-p:TelemetryToken=$env:TOKEN"
          Copy-Item out/bin/netpaw-cli.exe out/bin-telemetry/
          wix build deploy/msi/Package.wxs -arch x64 -d Telemetry=1 -d Version=${{ steps.ver.outputs.version }} -d BinDir=out/bin-telemetry -o out/NetPaw-${{ steps.ver.outputs.version }}-telemetry.msi
          function HasMeta($f) { [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f)).Contains('TelemetryToken') }
          if (-not (HasMeta 'out/bin-telemetry/NetPaw.exe')) { throw "telemetry metadata missing from the variant" }
          if (HasMeta 'out/bin/NetPaw.exe') { throw "default build must not carry telemetry metadata" }
      - name: Winget facts (release asset the catwinget sync reads — no MSI parsing on Linux needed)
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $msi = Get-Item "out/NetPaw-$ver.msi"
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi.FullName, 0))
          function Prop($name) {
            $v = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='$name'"))
            $v.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $v, $null) | Out-Null
            $r = $v.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $v, $null)
            if ($r) { $r.GetType().InvokeMember('StringData', 'GetProperty', $null, $r, @(1)) } else { '' }
          }
          $facts = [ordered]@{
            packageIdentifier = 'smol-kitten.NetPaw'; version = $ver; tag = "v$ver"
            installerUrl = "https://github.com/smol-kitten/netpaw/releases/download/v$ver/NetPaw-$ver.msi"
            installerSha256 = (Get-FileHash $msi -Algorithm SHA256).Hash
            installerType = 'wix'; scope = 'machine'; architecture = 'x64'
            productCode = (Prop 'ProductCode'); upgradeCode = (Prop 'UpgradeCode'); productName = (Prop 'ProductName'); publisher = (Prop 'Manufacturer')
            dependencies = @('Microsoft.DotNet.DesktopRuntime.10')
            releaseNotesUrl = "https://github.com/smol-kitten/netpaw/releases/tag/v$ver"
          }
          $facts | ConvertTo-Json -Depth 4 | Set-Content "out/NetPaw-$ver.winget.json"
          Get-Content "out/NetPaw-$ver.winget.json"
      - uses: actions/upload-artifact@v7
        with:
          name: netpaw-msi
          path: |
            out/*.msi
            out/*.winget.json
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            out/*.msi
            out/*.winget.json
      - name: Tell catwinget (repository_dispatch; needs the CATWINGET_DISPATCH_TOKEN secret — polling is the fallback)
        if: startsWith(github.ref, 'refs/tags/v') && env.DISPATCH != ''
        shell: pwsh
        env:
          DISPATCH: ${{ secrets.CATWINGET_DISPATCH_TOKEN }}
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $body = @{ event_type = 'netpaw-release'; client_payload = @{ version = $ver; facts = "https://github.com/smol-kitten/netpaw/releases/download/v$ver/NetPaw-$ver.winget.json" } } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/polo-nyan/catwinget/dispatches' -Headers @{ Authorization = "Bearer $env:DISPATCH"; Accept = 'application/vnd.github+json' } -Body $body -ContentType 'application/json'
          "dispatched netpaw-release $ver to polo-nyan/catwinget"
