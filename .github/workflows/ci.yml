name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', 'deploy/gpo/**', 'deploy/intune/**' ]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  test-and-publish:
    # Linux runner on purpose: NetPaw.Core is OS-neutral and the WinForms app cross-compiles
    # via EnableWindowsTargeting. Only the netsh/GUI behaviour needs a real Windows box.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET install directory
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/NetPaw.Core.Tests --verbosity minimal
      - name: Validate packs (hashes, schema, signature)
        run: |
          dotnet build src/NetPaw.Cli -c Release
          for f in packs/*/index.json; do
            dotnet src/NetPaw.Cli/bin/Release/net10.0/netpaw-cli.dll pack verify "$f" "$(cat "$(dirname "$f")/public.txt")"
          done
      - name: Publish (framework-dependent, tiny)
        run: |
          dotnet publish src/NetPaw.Tray -c Release -r win-x64 --self-contained false -o out/netpaw-win-x64
          dotnet publish src/NetPaw.Cli  -c Release -r win-x64 --self-contained false -o out/netpaw-win-x64
      - name: Publish (self-contained, no runtime needed)
        run: |
          dotnet publish src/NetPaw.Tray -c Release -r win-x64 --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -o out/netpaw-win-x64-standalone
          dotnet publish src/NetPaw.Cli  -c Release -r win-x64 --self-contained true -o out/netpaw-win-x64-standalone
      - name: Zip
        run: |
          cd out && rm -f */*.pdb
          zip -qr netpaw-win-x64.zip netpaw-win-x64
          zip -qr netpaw-win-x64-standalone.zip netpaw-win-x64-standalone
      - uses: actions/upload-artifact@v7
        continue-on-error: true   # artifact quota must not fail the job
        with:
          name: netpaw-win-x64
          path: out/*.zip
          retention-days: 14
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true

  msi:
    # The only job on a hosted Windows runner: WiX 5 needs Windows, and msiexec lets CI prove the
    # package installs and uninstalls cleanly. Free for a public repo.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish (framework-dependent)
        run: |
          dotnet publish src/NetPaw.Tray -c Release -r win-x64 --self-contained false -o out/bin
          dotnet publish src/NetPaw.Cli  -c Release -r win-x64 --self-contained false -o out/bin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build MSI (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build deploy/msi/Package.wxs -arch x64 -d Version=${{ steps.ver.outputs.version }} -d BinDir=out/bin -o out/NetPaw-${{ steps.ver.outputs.version }}.msi
      - name: Install / verify / uninstall
        shell: pwsh
        run: |
          $msi = Get-Item out/*.msi
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v out/install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content out/install.log | Select-Object -Last 40; throw "install exit $($p.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\NetPaw\NetPaw.exe")) { throw "NetPaw.exe missing after install" }
          if (-not (Test-Path "$env:ProgramData\NetPaw\profiles.d")) { throw "profiles.d missing after install" }
          & "$env:ProgramFiles\NetPaw\netpaw-cli.exe" where
          & "$env:ProgramFiles\NetPaw\netpaw-cli.exe" policy
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\NetPaw\NetPaw.exe") { throw "NetPaw.exe still present after uninstall" }
      - uses: actions/upload-artifact@v7
        with:
          name: netpaw-msi
          path: out/*.msi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.msi
